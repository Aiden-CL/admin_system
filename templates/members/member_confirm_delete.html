{% extends "base.html" %}

{% block title %}删除人员 - 管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-exclamation-triangle text-danger"></i> 删除人员</h2>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card form-card">
            <div class="card-body">
                <div class="alert alert-danger">
                    <h5>确认删除</h5>
                    <p>您确定要删除人员 <strong>{{ member.name }}</strong> 吗？此操作不可撤销。</p>
                </div>
                <dl class="row mb-4">
                    <dt class="col-sm-4">姓名</dt>
                    <dd class="col-sm-8">{{ member.name }}</dd>
                    <dt class="col-sm-4">手机号</dt>
                    <dd class="col-sm-8">{{ member.phone }}</dd>
                    <dt class="col-sm-4">注册时间</dt>
                    <dd class="col-sm-8">{{ member.created_at|date:"Y-m-d H:i" }}</dd>
                </dl>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> 确认删除
                        </button>
                        <a href="{% url 'members:member_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
